apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusflow-config
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexusflow-secrets
type: Opaque
stringData:
  MONGODB_URI: mongodb://mongodb:27017/nexusflow
  JWT_SECRET: change-me-in-production
  ENCRYPTION_KEY: change-me-in-production-64-char-hex
