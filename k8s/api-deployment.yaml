apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusflow-api
  labels:
    app: nexusflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusflow-api
  template:
    metadata:
      labels:
        app: nexusflow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USERNAME/nexusflow-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: MONGODB_URI
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexusflow-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexusflow-config
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: ENCRYPTION_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexusflow-api
spec:
  selector:
    app: nexusflow-api
  ports:
    - port: 3001
      targetPort: 3001
